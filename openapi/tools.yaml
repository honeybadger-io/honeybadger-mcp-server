# Tool overlay: the words for each MCP tool and the few places it differs from
# the spec. The spec (bundled.yaml) owns every tool's shape; make generate
# builds internal/hbmcp/zz_generated_tools.go from the two and fails, naming
# each problem, when this file no longer matches the spec.
#
# Per tool: operation (or operations), title, description, and per parameter a
# description. A spec field is exposed unless excluded, and every exclusion and
# override says why:
#   exclude: <reason>            leave a spec field out
#   rename: <name> + reason      MCP name for a spec field
#   as: date + reason            MCP takes a date; the handler converts it
#   shallow: <topic>             advertise only the top-level type
#   confirm: true                delete gated on a confirmation token
#   handwritten: true            the definition stays in Go
#   long: <reason>               a description over the cap (300 tool, 120 parameter)

# Hand-written: no single operation fits.
get_reference:
  handwritten: true
search_tools:
  handwritten: true
update_fault:
  handwritten: true # resolved/ignored booleans and snooze null map onto nine operations

# Projects

list_projects:
  operation: listProjects
  title: List Projects
  description: List all Honeybadger projects (returns summary info; use get_project for full details). A project can have several Ingestion Keys; list them with list_ingestion_keys.
  params:
    name: { description: Optional exact project name; returns only the project with that name }
    page: { exclude: The tool returns every project. }
    per_page: { exclude: The tool returns every project. }

get_project:
  operation: getProject
  title: Get Project
  description: Get a single Honeybadger project by ID. Its Ingestion Keys aren't included; list them with list_ingestion_keys.
  params:
    project_id: { description: The ID of the project to retrieve }

create_project:
  operation: createProject
  title: Create Project
  description: Create a new Honeybadger project
  params:
    name: { description: The name of the new project }
    resolve_errors_on_deploy: { description: Whether all unresolved faults should be marked as resolved when a deploy is recorded }
    disable_public_links: { description: Whether to allow fault details to be publicly shareable via a button on the fault detail page }
    user_url: { description: "A URL format like 'http://example.com/admin/users/[user_id]' that will be displayed on the fault detail page" }
    source_url:
      description: "A URL format like 'https://gitlab.com/username/reponame/blob/[sha]/[file]#L[line]' that is used to link lines in the backtrace to your git browser"
      long: Carried over from the hand-written definition; trimmed in task 6.
    purge_days: { description: The number of days to retain data (up to the max number of days available to your subscription plan) }
    user_search_field: { description: "A field such as 'context.user_email' that you provide in your error context" }
    language: { description: "Primary language, used to format backtraces." }
    asana_workspace_id: { description: Asana workspace for the project's Asana integration. }
    customer_throttle: { description: Notices accepted per minute before throttling. }
    team_id: { description: "Team to create the project in. Needs the team:write scope as well." }
    disable_email_notifications: { description: Add the project's members with email notifications off. }

update_project:
  operation: updateProject
  title: Update Project
  description: Update an existing Honeybadger project
  params:
    project_id: { description: The ID of the project to update }
    name: { description: A new name for the project }
    resolve_errors_on_deploy: { description: Whether all unresolved faults should be marked as resolved when a deploy is recorded }
    disable_public_links: { description: Whether to allow fault details to be publicly shareable via a button on the fault detail page }
    user_url:
      description: "A URL format like 'http://example.com/admin/users/[user_id]' that will be displayed on the fault detail page. Null clears it."
      long: Carried over from the hand-written definition; trimmed in task 6.
    source_url:
      description: "A URL format like 'https://gitlab.com/username/reponame/blob/[sha]/[file]#L[line]' that is used to link lines in the backtrace to your git browser. Null clears it."
      long: Carried over from the hand-written definition; trimmed in task 6.
    purge_days: { description: The number of days to retain data (up to the max number of days available to your subscription plan) }
    user_search_field: { description: "A field such as 'context.user_email' that you provide in your error context. Null clears it." }
    language: { description: "Primary language, used to format backtraces. Null clears it." }
    asana_workspace_id: { description: Asana workspace for the project's Asana integration. Null clears it. }
    customer_throttle: { description: Notices accepted per minute before throttling. Null clears it. }

delete_project:
  operation: deleteProject
  confirm: true
  title: Delete Project
  description: Delete a Honeybadger project and all of its data.
  params:
    project_id: { description: The ID of the project to delete }

get_project_occurrence_counts:
  operations: [getProjectOccurrences, listAccountOccurrences]
  title: Get Project Occurrence Counts
  description: Get occurrence counts over time, for one project or across every project the credential can reach.
  params:
    project_id: { description: Optional project ID. Omit to report across every project the credential can reach. }
    period:
      description: "Window to report over: 'hour' (61 one-minute buckets), 'day' (25 hourly), 'week' (8 daily), or 'month' (31 daily). Defaults to 'hour'"
      long: Carried over from the hand-written definition; trimmed in task 6.
    environment: { description: Optional environment name to filter results }
    page: { exclude: The tool returns every project's series. }
    per_page: { exclude: The tool returns every project's series. }

# Faults and notices

list_faults:
  operation: listFaults
  title: List Faults
  description: "Get a list of faults for a project with optional filtering and ordering. Requires reference topic: errors (fetch via get_reference; skip if still visible in your context) for the fault/notice model and the q search syntax."
  params:
    project_id: { description: The ID of the project to get faults for }
    q: { description: Search string to filter faults (see the errors reference topic for the search query syntax) }
    created_after: &created_after
      description: "Filter faults created after this time: an RFC 3339 timestamp (2026-01-02T15:04:05Z) or a date (2026-01-02, midnight UTC)"
      long: Carried over from the hand-written definition; trimmed in task 6.
      as: date
      reason: Agents write dates reliably and Unix seconds unreliably; the handler converts.
    occurred_after: &occurred_after
      description: "Filter faults that occurred after this time: an RFC 3339 timestamp (2026-01-02T15:04:05Z) or a date (2026-01-02, midnight UTC)"
      long: Carried over from the hand-written definition; trimmed in task 6.
      as: date
      reason: Agents write dates reliably and Unix seconds unreliably; the handler converts.
    occurred_before: &occurred_before
      description: "Filter faults that occurred before this time: an RFC 3339 timestamp (2026-01-02T15:04:05Z) or a date (2026-01-02, midnight UTC)"
      long: Carried over from the hand-written definition; trimmed in task 6.
      as: date
      reason: Agents write dates reliably and Unix seconds unreliably; the handler converts.
    order: { description: "Order results by 'recent' or 'frequent'" }
    sort: { exclude: api-go has no option for it. }
    page: { description: Page number for pagination }
    per_page: { description: Maximum number of faults to return (max 100) }

get_fault:
  operation: getFault
  title: Get Fault
  description: "Get detailed information for a specific fault in a project. last_notice_deploy is the newest deploy in the fault's environment before its last notice: a guess from timing, not the deploy that introduced or resolved the error."
  params:
    project_id: { description: The ID of the project containing the fault }
    fault_id: { description: The ID of the fault to retrieve }

get_fault_counts:
  operation: getFaultSummary
  title: Get Fault Counts
  description: "Get fault count statistics for a project, with optional filtering. Requires reference topic: errors (fetch via get_reference; skip if still visible in your context) for the q search syntax."
  params:
    project_id: { description: The ID of the project to get fault counts for }
    q: { description: Search string to filter faults (see the errors reference topic for the search query syntax) }
    created_after: *created_after
    occurred_after: *occurred_after
    occurred_before: *occurred_before

list_fault_notices:
  operation: listNotices
  title: List Fault Notices
  description: Get a list of notices (individual error events) for a specific fault
  params:
    project_id: { description: The ID of the project containing the fault }
    fault_id: { description: The ID of the fault to get notices for }
    limit: { description: Maximum number of notices to return (max 100) }
    before: { description: "Cursor for older notices: pass time_series.oldest_cursor from the previous response" }
    after: { description: "Cursor for newer notices: pass time_series.newest_cursor from the previous response" }
    breadcrumbs:
      description: "Include each notice's breadcrumbs: the clicks, logs, requests and other events recorded before the error, oldest first. Off by default because each trail can hold up to 40 entries"
      long: Carried over from the hand-written definition; trimmed in task 6.
    unmapped: { exclude: api-go has no option for it. }

list_fault_affected_users:
  operation: listFaultAffectedUsers
  title: List Fault Affected Users
  description: Get a list of users who were affected by a specific fault with occurrence counts. At most 500 users are returned, with or without q.
  params:
    project_id: { description: The ID of the project containing the fault }
    fault_id: { description: The ID of the fault to get affected users for }
    q: { description: Search string to filter affected users }

# Fault comments

list_fault_comments:
  operation: listComments
  title: List Fault Comments
  description: List every comment on a fault, newest first.
  params:
    project_id: { description: The ID of the project containing the fault }
    fault_id: { description: The ID of the fault the comments belong to }
    limit: { exclude: The tool returns every comment. }
    before: { exclude: The tool returns every comment. }
    after: { exclude: The tool returns every comment. }

get_fault_comment:
  operation: getComment
  title: Get Fault Comment
  description: Get a single comment on a fault by ID.
  params:
    project_id: { description: The ID of the project containing the fault }
    fault_id: { description: The ID of the fault the comments belong to }
    comment_id: { description: The ID of the comment }

create_fault_comment:
  operation: createComment
  title: Create Fault Comment
  description: Add a comment to a fault. @mentions notify the named project members. With an account-scoped API Token, the comment is attributed to the token's name.
  params:
    project_id: { description: The ID of the project containing the fault }
    fault_id: { description: The ID of the fault the comments belong to }
    body: { description: The comment text (must not be blank) }

update_fault_comment:
  operation: updateComment
  title: Update Fault Comment
  description: Replace the body of an existing fault comment. Returns the comment as stored. Only the comment's author can edit it, so an account-scoped API Token, which has no author, is refused with access_denied.
  params:
    project_id: { description: The ID of the project containing the fault }
    fault_id: { description: The ID of the fault the comments belong to }
    comment_id: { description: The ID of the comment }
    body: { description: The comment text (must not be blank) }

delete_fault_comment:
  operation: deleteComment
  confirm: true
  title: Delete Fault Comment
  description: Delete an existing comment from a fault. An account-scoped API Token can delete a comment only when it can manage the project.
  params:
    project_id: { description: The ID of the project containing the fault }
    fault_id: { description: The ID of the fault the comments belong to }
    comment_id: { description: The ID of the comment }

# Uptime sites

list_sites:
  operation: listSites
  title: List Sites
  description: "List a project's uptime sites: the URLs Honeybadger checks, with their current state (up, down, paused)."
  params:
    project_id: { description: The ID of the project to list sites for }
    page: { exclude: The tool returns every site. }
    per_page: { exclude: The tool returns every site. }

get_site:
  operation: getSite
  title: Get Site
  description: "Get an uptime site: its URL, check settings and current state. Up, down and cert_will_expire events name the site by ID."
  params:
    project_id: { description: The ID of the project the site belongs to }
    site_id: { description: "The ID of the site, a UUID" }

create_site:
  operation: createSite
  title: Create Site
  description: Start uptime monitoring for a URL. Only url is required; the rest default as described.
  params: &site_settings
    project_id: { description: The ID of the project to create the site in }
    url: { description: "The URL to check. Must start with http:// or https://." }
    name: { description: A display name for the site }
    frequency: { description: "Minutes between checks: 1, 2, 5 or 15. Defaults to 5; a value more frequent than the plan allows is refused." }
    locations: { description: "Locations to check from. [] or null checks from every location." }
    match: { description: "What match_type compares against. Required unless match_type is success; null clears it." }
    match_type:
      description: "How a response passes: success (any 2xx; leave match out), exact (status code equals match), include or exclude (the body does or doesn't contain match), jmespath (match is a JMESPath expression over the JSON body). Defaults to success."
      long: Carried over from the hand-written definition; trimmed in task 6.
    request_method: { description: Defaults to GET }
    request_body: { description: "A body to send with the request, up to 32 KB; null clears it" }
    request_headers: { description: "Headers to send, as name to value. Replaces the stored headers; {} or null clears them." }
    timeout:
      description: "Request timeout in seconds, 1 to 120, shorter than the frequency. Defaults to 30; only accounts with the uptime-timeout feature can change it."
      long: Carried over from the hand-written definition; trimmed in task 6.
    outage_threshold: { description: Consecutive failures before an outage is declared. null declares one when half the locations fail. }
    validate_ssl: { description: "Fail the check when the TLS certificate doesn't validate. Defaults to true." }
    active: { description: Whether the site is checked. Defaults to true. }

update_site:
  operation: updateSite
  title: Update Site
  description: "Change an uptime site's settings. Only the parameters given are changed, and null resets a setting to its default; name and url have no default, so they can be changed but not reset."
  params:
    <<: *site_settings
    project_id: { description: The ID of the project the site belongs to }
    site_id: { description: "The ID of the site, a UUID" }
    url: { description: "A new URL to check. Must start with http:// or https://." }

delete_site:
  operation: deleteSite
  confirm: true
  title: Delete Site
  description: Stop monitoring an uptime site and delete it.
  params:
    project_id: { description: The ID of the project the site belongs to }
    site_id: { description: "The ID of the site to delete, a UUID" }

list_site_outages:
  operation: listOutages
  title: List Site Outages
  description: "List an uptime site's outages, newest first: when it went down and came back up, with the status and reason from the failing check. Use it to explain a down or up event. To page back, pass the previous response's next_created_before as created_before."
  params:
    project_id: { description: The ID of the project the site belongs to }
    site_id: { description: "The ID of the site, a UUID" }
    limit: { description: "Most items to return, up to 100 (default 25)" }
    created_before: { description: "Page back: the previous response's next_created_before, unchanged" }
    created_after: { exclude: api-go has no option for it. }

list_uptime_checks:
  operation: listUptimeChecks
  title: List Uptime Checks
  description: "List an uptime site's individual checks, newest first: each check's location, response status and duration. A busy site has many; keep limit small. To page back, pass the previous response's next_created_before as created_before."
  params:
    project_id: { description: The ID of the project the site belongs to }
    site_id: { description: "The ID of the site, a UUID" }
    limit: { description: "Most items to return, up to 100 (default 25)" }
    created_before: { description: "Page back: the previous response's next_created_before, unchanged" }
    created_after: { exclude: api-go has no option for it. }

# Check-ins

list_check_ins:
  operation: listCheckIns
  title: List Check-Ins
  description: "List check-ins (cron/scheduled task monitoring) for a Honeybadger project. Returns every check-in, following pagination. To interpret check-in state and schedule fields, fetch reference topic: checkins (via get_reference)."
  params:
    project_id: { description: The ID of the project to list check-ins for }
    page: { exclude: The tool returns every check-in. }
    per_page: { exclude: The tool returns every check-in. }

get_check_in:
  operation: getCheckIn
  title: Get Check-In
  description: "Get a single check-in by ID. To interpret check-in state and schedule fields, fetch reference topic: checkins (via get_reference)."
  params:
    project_id: { description: The ID of the project the check-in belongs to }
    check_in_id: { description: The ID of the check-in to retrieve }

create_check_in:
  operation: createCheckIn
  title: Create Check-In
  description: "Create a new check-in for a Honeybadger project. Check-ins monitor cron jobs and scheduled tasks by alerting when an expected report doesn't arrive. IMPORTANT: Requires reference topic: checkins — fetch via get_reference first (skip if still visible in your context) for schedule types, the required field per type, plan gating (cron needs the Business plan), and the timezone format."
  long: Carried over from the hand-written definition; trimmed in task 6.
  params:
    project_id: { description: The ID of the project to create the check-in in }
    name: { description: "The name of the check-in. Optional: an unnamed check-in shows its ID." }
    schedule_type: { description: "The schedule type: 'simple' (report every fixed period) or 'cron' (report on a cron schedule)" }
    report_period: { description: "How often the check-in is expected to report, e.g. '1 day', '30 minutes'. Required for simple schedules." }
    grace_period: { description: "Optional amount of time to allow a late report before alerting, e.g. '5 minutes'" }
    cron_schedule: { description: "Cron expression defining when the check-in is expected to report, e.g. '0 5 * * *'. Required for cron schedules." }
    cron_timezone:
      description: "Optional timezone for the cron schedule. Rails/ActiveSupport zone name (e.g. 'Eastern Time (US & Canada)', 'London'), NOT an IANA identifier like 'America/New_York'. Defaults to UTC."
      long: Carried over from the hand-written definition; trimmed in task 6.
    slug: { description: "Optional URL-friendly identifier used to report the check-in (e.g. 'nightly-backups')" }

update_check_in:
  operation: updateCheckIn
  title: Update Check-In
  description: "Update an existing check-in. Only the provided fields change, and null clears one. IMPORTANT: Requires reference topic: checkins — fetch via get_reference first (skip if still visible in your context) for schedule fields, plan gating, and the timezone format."
  long: Carried over from the hand-written definition; trimmed in task 6.
  params:
    project_id: { description: The ID of the project the check-in belongs to }
    check_in_id: { description: The ID of the check-in to update }
    name: { description: A new name for the check-in }
    schedule_type: { description: "Switch between 'simple' and 'cron'. Switching to simple clears cron_schedule." }
    report_period: { description: "How often the check-in is expected to report, e.g. '1 day', '30 minutes'. Used by simple schedules." }
    grace_period: { description: "Amount of time to allow a late report before alerting, e.g. '5 minutes'" }
    cron_schedule: { description: Cron expression defining when the check-in is expected to report. Used by cron schedules. }
    cron_timezone:
      description: "Timezone for the cron schedule. Rails/ActiveSupport zone name (e.g. 'Eastern Time (US & Canada)', 'London'), NOT an IANA identifier like 'America/New_York'."
      long: Carried over from the hand-written definition; trimmed in task 6.
    slug: { description: URL-friendly identifier used to report the check-in }

delete_check_in:
  operation: deleteCheckIn
  confirm: true
  title: Delete Check-In
  description: "Delete a check-in. This also deletes the check-in's reporting history."
  params:
    project_id: { description: The ID of the project the check-in belongs to }
    check_in_id: { description: The ID of the check-in to delete }

list_check_in_events:
  operation: listCheckInEvents
  title: List Check-In Events
  description: "List a check-in's history, newest first: each time it reported, went missing or was paused. Use it to explain a check_in_missing or check_in_reporting event. To page back, pass the previous response's next_created_before as created_before."
  params:
    project_id: { description: The ID of the project the check-in belongs to }
    check_in_id: { description: The ID of the check-in }
    limit: { description: "Most items to return, up to 100 (default 25)" }
    created_before: { description: "Page back: the previous response's next_created_before, unchanged" }

# Deploys

list_deploys:
  operation: listDeploys
  title: List Deploys
  description: "List a project's deploys, newest first: revision, repository, environment and who deployed. Filter by environment or deployer. To page back, pass before from the previous response's time_series.oldest_cursor."
  params:
    project_id: { description: The ID of the project to list deploys for }
    environment: { description: "Only deploys to this environment, e.g. production" }
    local_username: { description: Only deploys recorded under this local_username }
    limit: { description: "Most items to return, up to 100 (default 25)" }
    before: { description: "Cursor for older deploys: time_series.oldest_cursor from the previous response" }
    after: { description: "Cursor for newer deploys: time_series.newest_cursor from the previous response" }

get_deploy:
  operation: getDeploy
  title: Get Deploy
  description: Get a deploy by ID. A deployed event and a fault's last_notice_deploy name deploys by ID.
  params:
    project_id: { description: The ID of the project the deploy belongs to }
    deploy_id: { description: The ID of the deploy }
